# ============================================================
# 美容室 月次KPI 設定ファイル
# 列名の候補は「推測」です。初回は実CSVで `python -m salon_kpi inspect` を実行し、
# 一致しない列名をここに追記してください。
# ============================================================

[stores]
# フォルダ名 = 表示名。data/raw/<YYYY-MM>/<フォルダ名>/ にCSVを置く
honten = "本店（芝田）"
chayamachi = "茶屋町店"

[targets]
monthly_sales = 10_000_000   # 両店共通の月商目標（税込/税抜は sales_tax 設定と揃える）

[rules]
repeat_window_days = 90       # 新規再来率：初回来店から何日以内の再来を「再来」とするか
sales_tax = "税込"            # SALON BOARDの金額列がどちらか。表示用ラベル
spa_keywords = ["スパ", "SPA", "spa", "Spa"]   # メニュー名にこの語を含めばスパ付帯とみなす
new_values = ["新規"]                          # 来店区分のうち「新規」と判定する値
nominated_values = ["指名", "本指名", "指名あり", "あり", "有", "○", "1"]  # 完全一致で指名とみなす
airpay_refund_values = ["取消", "返品", "返金", "キャンセル"]              # 部分一致でマイナス計上

# 幹部サマリーに出す項目（5〜6個に絞る）。指定可能キーは README 参照
executive_kpis = ["sales", "new_customers", "new_return_rate", "avg_ticket", "nomination_rate", "labor_cost_ratio"]

# ---- SALON BOARD 列名候補（上から順に最初に見つかった列を使う） ----
[salonboard.columns]
date        = ["来店日", "施術日", "会計日", "来店日時", "会計日時", "予約日"]
staff       = ["担当スタッフ", "スタッフ", "担当者", "スタイリスト", "施術者"]
customer_id = ["お客様番号", "顧客番号", "お客様ID", "顧客ID", "会員番号"]
visit_type  = ["新規/再来", "新規再来区分", "来店区分", "顧客区分", "新規・再来"]
nominated   = ["指名", "指名有無", "指名区分", "スタッフ指名"]
sales       = ["会計金額", "売上金額", "合計金額", "税込金額", "総額", "金額"]
menu        = ["メニュー", "施術メニュー", "メニュー名", "予約メニュー", "施術内容"]
receipt_id  = ["伝票番号", "会計番号", "伝票No", "会計ID"]

# ---- Airペイ 列名候補（売上の突合チェック用） ----
[airpay.columns]
date   = ["決済日時", "取引日時", "売上日", "日時", "決済日"]
amount = ["決済金額", "取引金額", "売上金額", "金額"]
status = ["取引種別", "種別", "ステータス", "取引区分"]
