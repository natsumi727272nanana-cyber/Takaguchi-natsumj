<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>enu Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: 縦型モバイル1カラム。上部に固定ヘッダー、カードは役割ごとにだけ枠を付ける */
/* Layout: 温かい白地に白いカード、太めのゴシック。画面下にタブ。 */
:root {
  --bg: #f4f0ea;
  --surface: #ffffff;
  --ink: #2b2723;
  --muted: #7b736b;
  --line: #e7e0d6;
  --track: #e9e3da;
  --accent: #8b5a2b;
  --accent-soft: #f3e9dd;
  --rose: #a5583f;
  --ok: #3d7a4e; --ok-soft: #e4f0e4;
  --wait: #a2650f; --wait-soft: #f8ecd6;
  --ng: #b0473d; --ng-soft: #f7e3df;
  --lock: #a8a097;
  --on-accent: #ffffff;
  --display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --logo: "Josefin Sans", "Zen Kaku Gothic New", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1a1714; --surface: #24201c; --ink: #efe9e1; --muted: #a89e93; --line: #3a332c; --track: #3a332c;
  --accent: #d9a877; --accent-soft: #3a2c1f; --rose: #e39a82;
  --ok: #8cc79b; --ok-soft: #22322a; --wait: #e6b765; --wait-soft: #3a2e1b; --ng: #ee9389; --ng-soft: #3d2420; --lock: #6b6259;
  --on-accent: #1f1912; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1a1714; --surface: #24201c; --ink: #efe9e1; --muted: #a89e93; --line: #3a332c; --track: #3a332c;
  --accent: #d9a877; --accent-soft: #3a2c1f; --rose: #e39a82;
  --ok: #8cc79b; --ok-soft: #22322a; --wait: #e6b765; --wait-soft: #3a2e1b; --ng: #ee9389; --ng-soft: #3d2420; --lock: #6b6259;
  --on-accent: #1f1912; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.75; margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; line-height: 1.4 }

.wrap { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
header.bar .wrap { display: flex; align-items: center; gap: 10px; min-height: 54px; padding-block: 6px }
.back { border: 0; background: none; color: var(--accent); padding: 6px 4px; font-weight: 700; flex: none }
.brand { font-family: var(--display); font-size: 17px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.who { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.35; flex: none }
.who button { border: 0; background: none; color: var(--accent); padding: 0; font-size: 12px }

main .wrap { padding-block: 20px 56px; display: grid; gap: 20px }
.eyebrow { font-size: 11px; letter-spacing: .14em; color: var(--muted); font-weight: 700 }
.lead { color: var(--muted); margin: 0 }
.ptitle { display: grid; gap: 6px }
.ptitle h1 { font-family: var(--display); font-size: 24px }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }

/* 理念 */
.philo { background: var(--accent); color: var(--on-accent); border-radius: 14px; padding: 26px 22px; display: grid; gap: 12px }
.philo .eyebrow { color: inherit; opacity: .75; font-family: var(--display); letter-spacing: .2em; font-size: 12px }
.philo h1 { font-family: var(--display); font-size: 27px; letter-spacing: .04em }
.philo .tag { font-weight: 700; margin: 0 }
.philo p { margin: 0 }
.philo small { opacity: .7; font-size: 12px }

.goal { display: flex; gap: 14px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px }
.goal b { font-family: var(--display); font-size: 26px; color: var(--rose); white-space: nowrap; font-variant-numeric: tabular-nums }
.goal span { font-size: 13px; color: var(--muted); min-width: 0 }

/* メニュー */
.menu { display: grid; gap: 10px }
.tile { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px }
.tile:hover { border-color: var(--accent) }
.tile .num { font-family: var(--display); font-size: 13px; color: var(--accent); width: 26px; flex: none }
.tile .t { flex: 1; min-width: 0 }
.tile .t b { display: block; font-size: 16px }
.tile .t small { color: var(--muted); font-size: 12.5px; display: block; line-height: 1.5 }
.tile .chev { color: var(--muted); flex: none }
.tile.ai { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.tile.ai small, .tile.ai .chev, .tile.ai .num { color: var(--bg); opacity: .75 }

.meter { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden }
.meter i { display: block; height: 100%; background: var(--accent) }

/* 一覧 */
.group { display: grid; gap: 8px }
.group > h2 { font-size: 13px; color: var(--muted); letter-spacing: .08em }
.list { display: grid; gap: 8px }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px }
.row[disabled] { cursor: not-allowed; opacity: .55 }
.row .n { font-size: 12px; color: var(--muted); width: 22px; flex: none; font-variant-numeric: tabular-nums }
.row .t { flex: 1; min-width: 0; font-weight: 500; line-height: 1.5 }
.row .t small { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px }
.chip { font-size: 11.5px; padding: 2px 9px; border-radius: 99px; white-space: nowrap; flex: none; font-weight: 700; line-height: 1.6 }
.chip.todo { background: var(--line); color: var(--muted) }
.chip.prac { background: var(--accent-soft); color: var(--accent) }
.chip.wait { background: var(--wait-soft); color: var(--wait) }
.chip.ok { background: var(--ok-soft); color: var(--ok) }
.chip.ng { background: var(--ng-soft); color: var(--ng) }
.chip.lock, .chip.soon { background: transparent; color: var(--lock); border: 1px solid var(--line) }
.meta .chip { white-space: normal; flex: 0 1 auto }
.chip.info { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500 }

/* 本文（資料の書き方をそのまま表示） */
.section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0 }
.section > h3 { font-size: 15px }
.md { display: grid; gap: 10px; min-width: 0 }
.md p { margin: 0 }
.md h4 { font-size: 14.5px; color: var(--accent); margin-top: 6px }
.md ol, .md ul { margin: 0; padding-left: 1.4em; display: grid; gap: 6px }
.md ul.todo { list-style: none; padding-left: 0 }
.md ul.todo li::before { content: "□ "; color: var(--muted) }
.md blockquote { margin: 0; padding: 10px 14px; border-left: 3px solid var(--rose); background: var(--bg); border-radius: 0 8px 8px 0; font-weight: 500 }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0 }
.md .tablewrap { margin: 0 }
details.fold { border-top: 1px solid var(--line); padding-top: 10px }
details.fold:first-of-type { border-top: 0; padding-top: 0 }
details.fold summary { font-weight: 700; cursor: pointer; padding: 4px 0; color: var(--ink) }
details.fold[open] summary { color: var(--accent); margin-bottom: 8px }

.video { aspect-ratio: 16/9; max-width: 100%; border-radius: 12px; background: var(--ink); color: var(--bg); display: grid; place-items: center; text-align: center; padding: 16px; font-size: 13px }
.video a { color: var(--bg); font-weight: 700 }
.chapters { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: 14px }
.chapters b { font-variant-numeric: tabular-nums; color: var(--accent); margin-right: 10px }

.btns { display: flex; flex-wrap: wrap; gap: 8px }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: 10px; padding: 10px 16px; font-weight: 700 }
.btn.ghost { background: transparent; color: var(--accent) }
.btn.warn { background: transparent; color: var(--ng); border-color: var(--ng) }
.btn.wide { width: 100% }
.btn[disabled] { opacity: .45; cursor: not-allowed }
.note { font-size: 12.5px; color: var(--muted); margin: 0 }
.pending { color: var(--muted); font-size: 13px; margin: 0 }
.field { display: grid; gap: 4px }
.field label, .field .lbl { font-size: 12.5px; color: var(--muted) }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; width: 100% }
.toast { background: var(--ok-soft); color: var(--ok); border-radius: 10px; padding: 10px 14px; font-weight: 700; font-size: 13.5px }
.toast.err { background: var(--ng-soft); color: var(--ng) }

.count { display: flex; align-items: center; gap: 14px }
.count b { font-family: var(--display); font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1 }
.count small { color: var(--muted) }

/* ○×チェック */
.marks { display: grid; gap: 6px }
.mark { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg) }
.mark span { flex: 1; min-width: 0; font-size: 14px; line-height: 1.5 }
.ox { display: flex; gap: 4px; flex: none }
.ox label { width: 38px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 700; color: var(--muted) }
.ox input { position: absolute; opacity: 0; pointer-events: none }
.ox label:has(input[value="1"]:checked) { background: var(--ok-soft); color: var(--ok); border-color: var(--ok) }
.ox label:has(input[value="0"]:checked) { background: var(--ng-soft); color: var(--ng); border-color: var(--ng) }
.mark select { width: 76px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px; flex: none; font-variant-numeric: tabular-nums }
.star { color: var(--rose); font-weight: 700 }
.total { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; padding: 4px 2px }
.total b { font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums }

/* 記録 */
.rec { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; font-size: 13.5px }
.rec:first-child { border-top: 0; padding-top: 0 }
.rec .h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.rec .h span { color: var(--muted); font-size: 12px }
.rec .x { color: var(--ng); font-size: 13px }

/* ログイン */
.login h1 { font-family: var(--display); font-size: 30px }
.roles { display: flex; gap: 6px; flex-wrap: wrap }
.roles label { flex: 1; min-width: 90px; border: 1px solid var(--line); border-radius: 10px; padding: 9px; text-align: center; background: var(--surface); font-size: 13.5px }
.roles input { position: absolute; opacity: 0; pointer-events: none }
.roles label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700 }

/* ロードマップ */
.timeline { display: grid; position: relative; padding-left: 22px }
.timeline::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; background: var(--line) }
.tl { position: relative; padding: 0 0 18px }
.tl::before { content: ""; position: absolute; left: -21px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent) }
.tl.goalpt::before { background: var(--rose); border-color: var(--rose) }
.tl .m { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .06em }
.tl.goalpt .m { color: var(--rose) }
.tl b { display: block }
.tl p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px }

/* クイズ */
.q { display: grid; gap: 6px }
.q p { margin: 0; font-weight: 500 }
.opt { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--bg) }
.opt input { margin-top: 7px; flex: none }

/* 表 */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums }
th, td { padding: 9px 11px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top }
tr:last-child td { border-bottom: 0 }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; background: var(--bg) }
.md td { min-width: 6em }
.md td:first-child { white-space: nowrap; font-weight: 500 }
.nowrap td, .nowrap th { white-space: nowrap }

.filters { display: flex; gap: 6px; flex-wrap: wrap }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 13px }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }

/* チャット */
.chat { display: grid; gap: 10px }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap }
.msg.me { justify-self: end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px }
.msg.ai { justify-self: start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px }
.chatform { display: flex; gap: 8px }
.chatform input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px }
.sugg { display: flex; flex-wrap: wrap; gap: 6px }
.sugg button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 12.5px }

/* ---- スクリーンショットの見た目に合わせた上書き ---- */
body::before { background: var(--bg) }
header.bar { background: var(--bg); border-bottom: 0 }
header.bar .wrap { min-height: 52px }
.brand { font-weight: 700; font-size: 17px }
.brand.logo { font-family: var(--logo); font-size: 30px; letter-spacing: .04em; padding-top: 8px }
.brand.logo.small { font-size: 19px; padding-top: 4px; color: var(--muted) }
main .wrap { padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); gap: 16px }
.ptitle h1 { font-weight: 900; font-size: 24px }
.eyebrow { color: var(--accent) }
.section, .row, .tile, .card { border-radius: 18px; border-color: var(--line) }
.row { padding: 16px 18px; gap: 12px }
.row .t { font-weight: 700; font-size: 16.5px }
.row .t small { font-size: 13.5px; margin-top: 2px }
.row .n { display: none }
.chip { font-weight: 500; font-size: 12.5px; padding: 3px 12px; border: 1px solid transparent }
.chip.todo { background: transparent; color: var(--muted); border-color: var(--line) }
.row .t .chip { margin-left: 8px; vertical-align: 2px }
.group > h2 { font-size: 19px; font-weight: 900; color: var(--ink); letter-spacing: 0; margin-top: 6px }
.card { background: var(--surface); border: 1px solid var(--line); padding: 18px 20px; display: grid; gap: 6px; width: 100%; text-align: left }
.card .name { font-size: 20px; font-weight: 900 }
.card .name small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 6px }
.card .sub { color: var(--muted); font-size: 14px }
.card .big { display: flex; align-items: baseline; gap: 8px; color: var(--muted); font-size: 14px }
.card .big b { font-size: 26px; font-weight: 900; color: var(--ink); font-variant-numeric: tabular-nums }
.meter { height: 8px; background: var(--track) }
.meter i { background: var(--accent) }
button.card:hover { border-color: var(--accent) }
.card h3 { font-size: 19px; font-weight: 900 }
.philo { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 18px; padding: 20px }
.philo .eyebrow { color: var(--accent); opacity: 1; font-family: var(--logo); font-size: 13px; letter-spacing: .14em }
.philo h1 { font-family: var(--display); font-weight: 900; font-size: 21px }
.philo small { color: var(--muted); opacity: 1 }
.tile .num { font-family: var(--logo); color: var(--accent) }
.tile.ai { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.btn { border-radius: 14px; padding: 12px 18px }
.fig { display: block; width: 100%; max-width: 360px; margin: 0 auto; border-radius: 12px; background: #fff }
.fillq { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px }
.fillq:first-child { border-top: 0; padding-top: 0 }
.fillq p { margin: 0; font-size: 14.5px }
.fillq input { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 12px; width: 100% }
.fillq .res { font-size: 13px; font-weight: 700 }
.fillq .res.ok { color: var(--ok) } .fillq .res.ng { color: var(--ng) } .fillq .res.na { color: var(--muted); font-weight: 500 }
.tmenu { display: grid; gap: 10px }
.tm { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--surface); display: grid; gap: 4px }
.tm.core { border-color: var(--accent) }
.tm .price { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.2 }
.tm .price small { font-size: 14px; font-weight: 700; margin-left: 2px }
.tm .nm { font-size: 19px; font-weight: 900; line-height: 1.4 }
.tm p { margin: 0; font-size: 14.5px }
.tm .tags { display: flex; gap: 6px; flex-wrap: wrap }
.aj { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--surface); display: grid; gap: 6px; min-width: 0 }
.aj .en { font-family: var(--logo); letter-spacing: .08em; color: var(--accent); font-size: 15px }
.aj .nm { font-size: 19px; font-weight: 900; line-height: 1.3 }
.aj .for { margin: 0; font-weight: 700; font-size: 14.5px }
.aj .sc { color: var(--muted); font-size: 12.5px }
.aj table { font-size: 13px }
.aj td { white-space: nowrap }
.ajsearch { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; width: 100% }
.ck { cursor: pointer }
.ck input { width: 22px; height: 22px; flex: none; accent-color: var(--accent); margin: 0 }
.ck:has(input:checked) { background: var(--accent-soft); border-color: var(--accent) }
.ck:has(input:checked) span { color: var(--muted); text-decoration: line-through }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px) }
nav.tabs .in { max-width: 600px; margin: 0 auto; display: flex }
nav.tabs button { flex: 1; min-width: 0; border: 0; background: none; padding: 12px 0 14px; font-size: 12.5px; white-space: nowrap; line-height: 1.3; color: var(--muted); font-weight: 500 }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 900 }
</style>

<header class="bar"><div class="wrap">
  <button class="back" id="backBtn" hidden>‹ 戻る</button>
  <div class="brand" id="brand">enu Academy</div>
  <div class="who" id="who"></div>
</div></header>
<main><div class="wrap" id="view"></div></main>
<nav class="tabs" id="tabs" hidden><div class="in" id="tabsIn"></div></nav>

<script src="content.js"></script>
<script>
/* =====================================================================
   enu Academy アプリ本体（中身は content.js）
   ===================================================================== */
const C = window.ENU;
const ROLE = { owner: "オーナー", lead: "幹部（監督）", assistant: "アシスタント" };
const TYPE = {
  chore: "雑務：見て覚える", quiz: "アプリのテストで合格", tech: "技術：練習 → 先輩チェック",
  theory: "理論：口頭で答えて合格", shampoo: "採点表：80点以上＋★必須", roleplay: "ロープレ3回", read: "読んで覚える",
};
const STATUS = { todo: ["未着手", "todo"], prac: ["練習中", "prac"], wait: ["チェック待ち", "wait"], ok: ["合格", "ok"] };
const CATS = C.groups.flatMap(g => g.categories.map(c => ({ ...c, group: g.name, page: g.page })));
const LESSON_IDS = [...new Set(CATS.flatMap(c => c.lessons))].filter(id => !C.lessons[id].draft);
const L = id => ({ id, ...C.lessons[id] });
const pageLessons = page => [...new Set(C.groups.filter(g => g.page === page).flatMap(g => g.categories.flatMap(c => c.lessons)))].filter(id => !C.lessons[id].draft);

/* ---------- 保存 ----------
   claude.ai で開くと、全員の記録を共有の場所（db）に保存する（cloud モード）。
   それ以外（ファイルを直接開いたときなど）は、この端末のブラウザに保存する（local モード）。 */
const KEY = "enu-academy-v2";
let mode = window.claude?.use ? "loading" : "local";
let cloud = null, myUid = null, cloudNote = "";
const cloudState = { loaded: false, isOwner: false, members: {}, roles: {}, checks: {}, subs: {}, mine: null, ownerRoleWritten: false };
const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)) || { users: {}, current: null }; } catch { return { users: {}, current: null }; } },
  save() { if (mode === "cloud") return cloudSave(); try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} },
};
let db = mode === "local" ? store.load() : { users: {}, current: null };
let route = { name: "home" }, stack = [];

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => { const d = new Date(); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };
const me = () => db.users[db.current];
const isLead = u => u && (u.role === "owner" || u.role === "lead");
const prog = (u, id) => { const st = u.progress[id] ||= { status: "todo", practice: 0 }; st.records ||= []; st.stages ||= []; return st; };
const passed = (u, id) => u.progress[id]?.status === "ok";
const subject = () => route.uid ? db.users[route.uid] : me();   // 幹部が他の人の記録を見る時

/* ---------- 共有の記録（cloud モード） ----------
   members/<id>   … 本人だけが書く（名前・店舗・自分の練習記録）
   roles/<id>     … オーナーだけが書く（幹部・オーナー）
   checks/<幹部のid>/records/<id> … 幹部・オーナーが書く合格チェック。合格はここからだけ決まる */
const CHECK_TYPES = ["tech", "theory", "shampoo", "roleplay"];
const validChecker = uid => ["owner", "lead"].includes(cloudState.roles[uid]?.role);
function deriveProgress(uid, progress) {
  const byLesson = {};
  Object.entries(cloudState.checks).filter(([lid]) => validChecker(lid)).forEach(([, rs]) => rs.filter(r => r.member === uid).forEach(r => (byLesson[r.lesson] ||= []).push(r)));
  for (const id of Object.keys(C.lessons)) {
    const l = C.lessons[id];
    if (!CHECK_TYPES.includes(l.type)) continue;
    const rs = (byLesson[id] || []).slice().sort((a, b) => (a.at || 0) - (b.at || 0));
    if (!progress[id] && !rs.length) continue;
    const st = progress[id] ||= { status: "todo", practice: 0 };
    const ok = rs.filter(r => r.pass);
    st.records = rs;
    st.stages = l.type === "tech" ? [...new Set(ok.map(r => r.stage))] : l.type === "roleplay" ? [...new Set(ok.map(r => String(r.round)))] : [];
    const done = l.type === "tech" ? l.stages.every(s => st.stages.includes(s)) : l.type === "roleplay" ? l.rounds.every((_, i) => st.stages.includes(String(i + 1))) : ok.length > 0;
    if (done) { const last = ok.at(-1); Object.assign(st, { status: "ok", passedAt: last.date, passedBy: last.by }); continue; }
    delete st.passedAt; delete st.passedBy;
    const lastAt = rs.at(-1)?.at || 0;
    if (st.status === "wait" && (st.requestedAt || 0) > lastAt) continue;
    if (rs.length || st.status === "ok" || st.status === "wait") st.status = rs.length || st.practice ? "prac" : "todo";
  }
}
function rebuildUsers() {
  const users = {};
  for (const [uid, m] of Object.entries(cloudState.members)) {
    const u = uid === myUid && cloudState.mine ? cloudState.mine : structuredClone(m);
    u.progress ||= {};
    u.role = cloudState.roles[uid]?.role || "assistant";
    deriveProgress(uid, u.progress);
    users[uid] = u;
  }
  if (cloudState.mine && !users[myUid]) { const u = cloudState.mine; u.role = cloudState.roles[myUid]?.role || (cloudState.isOwner ? "owner" : "assistant"); deriveProgress(myUid, u.progress ||= {}); users[myUid] = u; }
  db = { users, current: users[myUid] ? myUid : null };
}
function memberPayload() {
  const m = cloudState.mine, progress = {};
  for (const [id, st] of Object.entries(m.progress || {})) {
    const { records, stages, passedAt, passedBy, ...rest } = st;
    if (CHECK_TYPES.includes(C.lessons[id]?.type)) { if (rest.status === "ok") rest.status = "prac"; progress[id] = rest; }
    else progress[id] = { ...rest, ...(passedAt ? { passedAt } : {}), ...(passedBy ? { passedBy } : {}) };
  }
  return { name: m.name, store: m.store || "", joined: m.joined || today(), joinDate: m.joinDate || "", debut: m.debut || "", monthGoal: m.monthGoal || "", progress };
}
let saveTimer = null, saving = false, saveAgain = false;
function cloudSave() { clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 400); }
async function flushSave() {
  saveTimer = null;
  if (!cloudState.mine) return;
  if (saving) { saveAgain = true; return; }
  saving = true;
  try { await cloud.doc("members/" + myUid).set(memberPayload()); }
  catch (e) { cloudNote = e?.code === "invalid_argument" ? "記録を保存できませんでした。高口さんに「編集者」として招待してもらってください。" : "記録を保存できませんでした。通信を確認して、もう一度やってみてください。"; render(); }
  saving = false;
  if (saveAgain) { saveAgain = false; flushSave(); }
}
function persistCheck(rec, memberId, lessonId) {
  if (mode !== "cloud") return;
  cloud.collection(`checks/${myUid}/records`).add({ ...rec, member: memberId, lesson: lessonId, byId: myUid })
    .catch(() => { cloudNote = "チェックの記録を保存できませんでした。もう一度記録してください。"; render(); });
}
let pendingRender = false;
const typing = () => { const a = document.activeElement; return a && a.closest?.("#view") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "checkbox" && a.type !== "radio"; };
function refresh() {
  rebuildUsers();
  if (typing()) { pendingRender = true; return; }
  const y = scrollY; render(); scrollTo(0, y);
}
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !typing()) { pendingRender = false; const y = scrollY; render(); scrollTo(0, y); } }, 0));
function cloudError() { cloudNote = "共有の記録を読み込めませんでした。ページを開き直してください。"; render(); }
function syncCheckSubs() {
  for (const uid of Object.keys(cloudState.roles)) {
    if (!validChecker(uid) || cloudState.subs[uid]) continue;
    cloudState.subs[uid] = cloud.collection(`checks/${uid}/records`).onSnapshot(s => { cloudState.checks[uid] = s.docs.map(d => ({ id: d.id, ...d.data() })); refresh(); }, cloudError);
  }
}
async function boot() {
  if (mode !== "loading") return render();
  render();
  let cdb = null, cu = null;
  try { [cdb, cu] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch {}
  myUid = cu ? await cu.id() : null;
  const canWrite = cu ? await cu.can("data.write") : null;
  if (!cdb || !myUid || canWrite === false) {
    mode = "local"; db = store.load();
    cloudNote = !cdb ? "" : !myUid ? "サインインしていないため、記録はこの端末だけに保存されます。" : "閲覧のみで開いているため、記録はこの端末だけに保存されます。高口さんに「編集者」として招待してもらってください。";
    return render();
  }
  cloud = cdb; mode = "cloud"; cloudState.isOwner = await cu.isOwner();
  cloud.collection("roles").onSnapshot(s => {
    cloudState.roles = Object.fromEntries(s.docs.map(d => [d.id, d.data()]));
    if (cloudState.isOwner && cloudState.roles[myUid]?.role !== "owner" && !cloudState.ownerRoleWritten) {
      cloudState.ownerRoleWritten = true; cloud.doc("roles/" + myUid).set({ role: "owner" }).catch(() => { cloudState.ownerRoleWritten = false; });
    }
    syncCheckSubs(); refresh();
  }, cloudError);
  cloud.collection("members").onSnapshot(s => {
    cloudState.members = Object.fromEntries(s.docs.map(d => [d.id, d.data()]));
    const remote = cloudState.members[myUid];
    if (remote && (!cloudState.mine || (!saving && !saveTimer && !s.metadata.hasPendingWrites))) cloudState.mine = structuredClone(remote);
    cloudState.loaded = true; refresh();
  }, cloudError);
}

function lessonLocked(u, cat, idx) {
  if (isLead(u) || idx === 0 || ["chore", "read"].includes(C.lessons[cat.lessons[idx]].type)) return false;
  return !passed(u, cat.lessons[idx - 1]);
}
// 前のレッスンに合格していないとき、そのレッスン名を返す（中身は見られる。練習とチェックだけ止める）
function blockedBy(u, id, catId) {
  if (isLead(me()) || ["chore", "read"].includes(C.lessons[id].type)) return null;   // 雑務はチェックなしなので順番待ちにしない
  const c = CATS.find(x => x.id === catId && x.lessons.includes(id)) || CATS.find(x => x.lessons.includes(id));
  const i = c.lessons.indexOf(id);
  return i > 0 && !passed(u, c.lessons[i - 1]) ? c.lessons[i - 1] : null;
}
// 毎日のチェックリスト（日付が変わると空に戻る）
const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
const checklistItems = l => l.weekly ? (l.weekly[WEEK[new Date().getDay()]] || []) : l.body.split("\n").filter(x => /^\d+\.\s/.test(x)).map(x => x.replace(/^\d+\.\s/, ""));
function todayDone(u, id) { const d = prog(u, id).daily; return d && d.date === today() ? d.done : []; }
function percent(u) { return Math.round(LESSON_IDS.filter(id => passed(u, id)).length / LESSON_IDS.length * 100); }
function chip(u, id, locked) {
  if (locked && prog(u, id).status === "todo") return `<span class="chip lock">予習OK</span>`;
  const [label, cls] = STATUS[prog(u, id).status];
  return `<span class="chip ${cls}">${label}</span>`;
}

/* ---------- 資料の書き方を表示用に変換（####・番号・箇条書き・表・引用・太字） ---------- */
function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
function md(src, fold) {
  const lines = String(src || "").split("\n");
  const top = Math.min(...lines.map(l => (l.match(/^(#{2,4})\s/) || [, "#####"])[1].length));
  let i = 0;
  const sections = []; let cur = { title: null, html: "" };
  const out = s => cur.html += s;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    let m;
    if ((m = line.match(/^#{2,4}\s+(.*)/))) {
      if (fold && line.indexOf(" ") === top) { if (cur.title || cur.html) sections.push(cur); cur = { title: m[1], html: "" }; }
      else out(`<h4>${inline(m[1])}</h4>`);
      i++; continue;
    }
    if (/^---+$/.test(line.trim())) { out("<hr>"); i++; continue; }
    if ((m = line.match(/^!\[(.*?)\]\((.+?)\)\s*$/))) { out(`<img class="fig" src="${esc(m[2])}" alt="${esc(m[1])}" loading="lazy">`); i++; continue; }
    if (line.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith("|")) { rows.push(lines[i]); i++; }
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(rows[0]), body = rows.slice(2).map(cells);
      out(`<div class="tablewrap"><table><thead><tr>${head.map(h => `<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (line.startsWith(">")) {
      const q = [];
      while (i < lines.length && lines[i].startsWith(">")) { q.push(lines[i].replace(/^>\s?/, "")); i++; }
      out(`<blockquote>${inline(q.join(" "))}</blockquote>`); continue;
    }
    if ((m = line.match(/^(\d+)\.\s/))) {
      const start = m[1], items = [];
      while (i < lines.length && /^\d+\.\s/.test(lines[i])) { items.push(lines[i].replace(/^\d+\.\s/, "")); i++; }
      out(`<ol${start !== "1" ? ` start="${start}"` : ""}>${items.map(t => `<li>${inline(t)}</li>`).join("")}</ol>`); continue;
    }
    if (/^\s+- /.test(line)) {
      const items = [];
      while (i < lines.length && /^\s+- /.test(lines[i])) { items.push(lines[i].trim().slice(2)); i++; }
      out(`<ul style="margin-left:1.4em">${items.map(t => `<li>${inline(t)}</li>`).join("")}</ul>`); continue;
    }
    if (/^- /.test(line)) {
      const items = [];
      while (i < lines.length && /^- /.test(lines[i])) { items.push(lines[i].slice(2)); i++; }
      const todo = items.every(t => /^(\[ \]|□)/.test(t));
      out(`<ul${todo ? ' class="todo"' : ""}>${items.map(t => `<li>${inline(t.replace(/^(\[ \]|□)\s*/, ""))}</li>`).join("")}</ul>`); continue;
    }
    out(`<p>${inline(line)}</p>`); i++;
  }
  if (!fold) return `<div class="md">${cur.html}</div>`;
  sections.push(cur);
  return sections.map(s => s.title ? `<details class="fold"><summary>${inline(s.title)}</summary><div class="md">${s.html}</div></details>` : `<div class="md">${s.html}</div>`).join("");
}

/* ---------- 画面遷移 ---------- */
function go(name, params = {}) { stack.push(route); route = { name, ...params }; render(); scrollTo(0, 0); }
// 画面下のタブ。タブを押すとそのページの一番上から
let activeTab = "home";
const TABS = () => [["home", "ホーム", { name: "home" }], ["work", "しごと", { name: "cats", page: "work" }], ["lesson", "レッスン", { name: "cats", page: "lesson" }],
  ["chat", "AI相談", { name: "chat" }], ["mypage", "マイページ", { name: "mypage" }], ...(isLead(me()) ? [["team", "スタッフ", { name: "team" }]] : [])];
function tab(key) { activeTab = key; stack = []; route = { ...TABS().find(t => t[0] === key)[2] }; render(); scrollTo(0, 0); }
function back() { route = stack.pop() || { name: "home" }; render(); scrollTo(0, 0); }
$("#backBtn").onclick = back;

/* ---------- ログイン ---------- */

  if (mode === "cloud") return `
  <section class="login ptitle">
    <div class="eyebrow">ENU ACADEMY</div>
    <h1>enu アカデミー</h1>
    <p class="lead">はじめに名前と店舗を登録してください。次からは、開くだけで続きから学べます。</p>
  </section>
  <form class="section" id="regForm">
    <div class="field"><label for="regName">名前</label><input id="regName" required placeholder="例：高口 なつみ" autocomplete="name"></div>
    <div class="field"><label for="regStore">店舗</label><select id="regStore">${C.stores.map(s => `<option>${esc(s)}</option>`).join("")}</select></div>
    <p class="note">幹部（監督）は、登録したあとに高口さんが設定します。</p>
    <button class="btn" type="submit">登録してはじめる</button>
  </form>`;
  const users = Object.entries(db.users);
  return `
  <section class="login ptitle">
    <div class="eyebrow">ENU ACADEMY</div>
    <h1>enu アカデミー</h1>
    <p class="lead">一度名前を登録すると、次からは続きから学べます。</p>
  </section>
  ${users.length ? `<section class="group"><h2>続きから</h2><div class="list">
    ${users.map(([id, u]) => `<button class="row" data-login="${id}"><span class="t">${esc(u.name)}<small>${esc(u.store || "")}</small></span><span class="chip prac">${ROLE[u.role]}</span></button>`).join("")}
  </div></section>` : ""}
  <form class="section" id="regForm">
    <h3>はじめての方</h3>
    ${msg ? `<div class="toast err">${esc(msg)}</div>` : ""}
    <div class="field"><label for="regName">名前</label><input id="regName" required placeholder="例：高口 なつみ" autocomplete="name"></div>
    <div class="field"><span class="lbl">立場</span><div class="roles">
      ${Object.entries(ROLE).map(([k, v]) => `<label><input type="radio" name="role" value="${k}" ${k === "assistant" ? "checked" : ""}>${v}</label>`).join("")}
    </div></div>
    <div class="field"><label for="regStore">店舗</label><select id="regStore">${C.stores.map(s => `<option>${esc(s)}</option>`).join("")}</select></div>
    <div class="field" id="pinField" hidden><label for="regPin">合格を出すときの暗証番号（数字4桁）</label><input id="regPin" type="password" inputmode="numeric" maxlength="4" placeholder="0000"></div>
    <button class="btn" type="submit">登録してはじめる</button>
  </form>`;
}
function bindLogin() {
  if (mode === "cloud") {
    $("#regForm").onsubmit = e => {
      e.preventDefault();
      const name = $("#regName").value.trim(); if (!name) return;
      cloudState.mine = { name, store: $("#regStore").value, progress: {}, joined: today() };
      rebuildUsers(); flushSave(); route = { name: "home" }; stack = []; activeTab = "home"; render();
    };
    return;
  }
  $$("[data-login]").forEach(b => b.onclick = () => { db.current = b.dataset.login; store.save(); route = { name: "home" }; stack = []; activeTab = "home"; render(); });
  $$("input[name=role]").forEach(r => r.onchange = () => { $("#pinField").hidden = $("input[name=role]:checked").value === "assistant"; });
  $("#regForm").onsubmit = e => {
    e.preventDefault();
    const name = $("#regName").value.trim(), role = $("input[name=role]:checked").value, pin = $("#regPin").value.trim();
    if (!name) return;
    if (role !== "assistant" && !/^\d{4}$/.test(pin)) { $("#view").innerHTML = viewLogin("暗証番号は数字4桁で入れてください"); return bindLogin(); }
    const id = "u" + Date.now();
    db.users[id] = { name, role, store: $("#regStore").value, pin: role === "assistant" ? "" : pin, progress: {}, joined: today() };
    db.current = id; store.save(); route = { name: "home" }; stack = []; activeTab = "home"; render();
  };
}

/* ---------- ホーム ---------- */
function stageLabel(u) {
  if (!u.joinDate) return "入社前";
  const j = new Date(u.joinDate), n = new Date();
  if (n < j) return "入社前";
  return `入社${(n.getFullYear() - j.getFullYear()) * 12 + n.getMonth() - j.getMonth() + 1}ヶ月目`;
}
function nextLessons(u, max = 3) {
  const out = [];
  const add = (id, sub) => { if (out.length < max && !out.some(x => x.id === id) && !passed(u, id) && !C.lessons[id].draft) out.push({ id, sub }); };
  C.preEntry.forEach(id => add(id, `入社前・${L(id).title}`));
  for (const c of CATS) c.lessons.forEach((id, i) => { if (!lessonLocked(u, c, i)) add(id, `${C.pages[c.page].title}・${c.title}`); });
  return out;
}
function waitingList() {
  const u = me();
  const who = isLead(u) ? Object.entries(db.users).filter(([, x]) => x.role === "assistant") : [[db.current, u]];
  return who.flatMap(([uid, x]) => LESSON_IDS.filter(id => x.progress[id]?.status === "wait").map(id => ({ uid, x, id })));
}
function viewHome() {

    <div class="eyebrow">${esc(P.eyebrow)}</div>
    <h1>${esc(P.title)}</h1>
    <p class="tag">${esc(P.lead)}</p>
    <p>${esc(P.message)}</p>

  </button>
  <button class="card" data-tab="mypage">
    <div class="name">${esc(u.name)}<small>${esc(u.store || "店舗未設定")}・${stageLabel(u)}</small></div>
    <div class="sub">目標デビュー日：${esc(u.debut || "—")}</div>
    <div class="big"><b>${done}/${LESSON_IDS.length}</b>課題 合格（${pct}%）</div>
    <div class="meter"><i style="width:${pct}%"></i></div>
    <div class="sub">今月の目標：${u.monthGoal ? esc(u.monthGoal) : "未設定（マイページで入力）"}</div>
  </button>
  <button class="card" ${lead ? 'data-tab="team"' : 'data-scroll="waits"'}>
    <h3>チェック待ち ${waits.length}件</h3>
    <div class="sub">${lead ? "タップして評価する" : waits.length ? "先輩に声をかけてチェックしてもらおう" : "練習が終わったら、レッスンからチェックをお願いしよう"}</div>
  </button>
  <section class="group"><h2>今日の掃除</h2><div class="list">
    ${["opening", "closing", "cleaning-weekly"].filter(id => checklistItems(L(id)).length).map(id => { const n = checklistItems(L(id)).length, d = todayDone(u, id).length;
      return `<button class="row" data-lesson="${id}"><span class="t">${esc(L(id).checklist.name)}<span class="chip ${d === n ? "ok" : d ? "prac" : "todo"}">${d}/${n}</span><small>${esc(L(id).title)}</small></span></button>`; }).join("")}
  </div></section>
  ${(() => { const nx = nextLessons(u); return nx.length ? `<section class="group"><h2>次に取り組む課題</h2><div class="list">
    ${nx.map(n => `<button class="row" data-lesson="${n.id}"><span class="t">${esc(L(n.id).title)}${chip(u, n.id)}<small>${esc(n.sub)}</small></span></button>`).join("")}
  </div></section>` : `<section class="group"><h2>次に取り組む課題</h2><p class="pending">いま開いている課題はすべて合格です。</p></section>`; })()}

    ${st.watched && l.preQuiz ? (st.preQuiz ? `<p class="toast">確認テスト合格・予習完了（${esc(st.preQuiz)}）</p>` : route.uid ? `<p class="pending">確認テストはまだです</p>` : `<form id="preQuizForm" class="marks" style="gap:12px"><h3>動画を見たら、確認テスト（全問正解で予習完了）</h3>

/* シャンプー：日ごとの教材・穴埋め小テスト・自己評価 */
const norm = s => String(s || "").normalize("NFKC").replace(/[\s［］\[\]　]/g, "").toLowerCase();
function daysPanel(l, st) {
  const fill = st.fill || {}, self = st.self || {};
  return `<section class="section"><h3>レッスン日程（全${l.rounds.length}回）</h3>
    <p class="note">日にちをタップすると、その日の教材が開きます。</p>
    ${l.rounds.map((r, ri) => { const f = fill[ri], open = route.openDay === ri;
      return `<details class="fold" data-day="${ri}" ${open ? "open" : ""}><summary>${esc(r.day || `${ri + 1}回目`)}（${esc(r.m)}）${ri + 1 >= l.judgeFrom ? "・合格判定" : ""}</summary><div class="md">
        <p>${esc(r.t)}</p>
        ${r.body ? md(r.body) : `<p class="pending">この日の教材は準備中です。</p>`}
        ${r.see ? `<div class="btns">${[].concat(r.see).map(id => `<button type="button" class="btn ghost" data-lesson="${id}">「${esc(L(id).title)}」を開く</button>`).join("")}</div>` : ""}
        ${r.fill ? `<h4>穴埋め小テスト</h4>
          ${f ? `<div class="toast ${f.score === f.total ? "" : "err"}">${f.score}/${f.total}問正解（${esc(f.date)}）</div>` : ""}
          <form class="marks" data-fillform="${ri}">${r.fill.map((q, qi) => { const ans = f?.answers?.[qi] ?? "", graded = q.a.length, ok = graded && q.a.some(a => norm(a) === norm(ans));
            return `<div class="fillq"><p>${qi + 1}. ${esc(q.q)}</p><input data-fill="${qi}" value="${esc(ans)}" autocomplete="off" aria-label="${qi + 1}問目の答え" ${route.uid ? "disabled" : ""}>
              ${f ? `<span class="res ${!graded ? "na" : ok ? "ok" : "ng"}">${!graded ? "答えは準備中（採点なし）" : ok ? "○ 正解" : `× 答え：${esc(q.a[0])}`}</span>` : ""}</div>`; }).join("")}
            ${route.uid ? "" : `<button class="btn" type="submit">答え合わせ</button>`}</form>` : ""}
        ${r.times ? `<h4>タイム記録</h4><div class="marks">${r.times.map((goal, ti) => { const v = st.times?.[ri]?.[ti] ?? "";
            return `<div class="mark"><span>${ti + 1}回目（目標 ${goal}分${r.allow ? `・${r.allow}分の超過までOK` : ""}）${v !== "" ? (Number(v) <= goal ? ' <b style="color:var(--ok)">○ 目標クリア</b>' : Number(v) <= goal + (r.allow || 0) ? ' <b style="color:var(--wait)">○ ' + r.allow + '分までの超過なのでOK</b>' : ' <b style="color:var(--ng)">あと' + (Math.round((Number(v) - goal - (r.allow || 0)) * 10) / 10) + '分</b>') : ""}</span>
              <input type="number" inputmode="decimal" min="0" step="0.5" data-time="${ri}-${ti}" value="${esc(v)}" aria-label="${ti + 1}回目のタイム（分）" style="width:76px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px" ${route.uid ? "disabled" : ""}> 分</div>`; }).join("")}</div>` : ""}
        ${r.memo ? `<h4>先輩からの課題</h4><textarea data-memo="${ri}" rows="2" placeholder="先輩に言われたことをメモ" style="width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px" ${route.uid ? "disabled" : ""}>${esc(st.memo?.[ri] || "")}</textarea>` : ""}
        ${r.selfCheck ? `<h4>自己評価</h4><div class="marks">${r.selfCheck.map((s, si) => `<label class="mark ck"><input type="checkbox" data-self="${ri}-${si}" ${(self[ri] || []).includes(si) ? "checked" : ""} ${route.uid ? "disabled" : ""}><span>${esc(s)}できた</span></label>`).join("")}</div>` : ""}
      </div></details>`; }).join("")}
  </section>`;
}
/* オージュアなどの商品一覧：シリーズで絞り込み、悩みの言葉で検索 */
function productsPanel(l) {
  const f = route.series || "すべて", q = (route.q || "").trim();
  const yen = n => n.toLocaleString() + "円";
  const lines = l.products.filter(s => f === "すべて" || s.series === f).flatMap(s => s.lines.map(x => ({ ...x, series: s.series })))
    .filter(x => !q || [x.en, x.name, x.for, x.series, ...x.items.map(i => i.name)].join(" ").toLowerCase().includes(q.toLowerCase()));
  return `<section class="group"><h2>商品一覧</h2>

    <div class="filters">${["すべて", ...l.products.map(s => s.series)].map(s => `<button data-series="${esc(s)}" aria-pressed="${s === f}">${esc(s)}</button>`).join("")}</div>
    ${lines.length ? lines.map(x => `<article class="aj">
      <div class="en">${esc(x.en)}</div><div class="nm">${esc(x.name)}</div>
      <p class="for">${esc(x.for)}</p><div class="sc">${esc(x.series)}・香り：${esc(x.scent)}</div>
      <div class="tablewrap"><table><tbody>${x.items.map(i => i.sizes.map((s, k) => `<tr><td>${k === 0 ? `<b>${esc(i.name)}</b>` : ""}</td><td>${esc(s)}</td><td style="text-align:right">${yen(i.prices[k])}</td></tr>`).join("")).join("")}</tbody></table></div>
    </article>`).join("") : `<p class="pending">見つかりませんでした。ほかの言葉で探してみてください。</p>`}
    <p class="note">価格はすべて希望小売価格（税込）。</p>
  </section>`;
}
function checklistPanel(l, u) {
  const items = checklistItems(l), done = todayDone(u, l.id), all = done.length === items.length;
  if (!items.length) return `<section class="section"><h3>今日の${esc(l.checklist.name)}</h3><p class="note">今日（${WEEK[new Date().getDay()]}曜日）は、曜日別のそうじはありません。</p></section>
    <section class="section"><h3>曜日ごとのやること</h3>${md(l.body)}</section>`;
  return `<section class="section"><h3>今日の${esc(l.checklist.name)}${l.weekly ? `（${WEEK[new Date().getDay()]}曜日）` : ""}（${done.length}/${items.length}）</h3>

    <div class="marks">${items.map((t, i) => `<label class="mark ck"><input type="checkbox" data-ck="${i}" ${done.includes(i) ? "checked" : ""} ${route.uid ? "disabled" : ""}><span>${inline(t)}</span></label>`).join("")}</div>

  </section>${l.weekly ? `<section class="section"><h3>曜日ごとのやること</h3>${md(l.body)}</section>` : ""}`;
}
function scoreSheetInfo(l) {
  return `<section class="section"><h3>採点表（100点満点）</h3>
    <p class="note">合格は${l.passScore}点以上、かつ<span class="star">★必須</span>の3項目が満点。★が1つでもできていなければ、点数が高くても不合格。合格判定は${l.judgeFrom}回目から。</p>
    <div class="tablewrap"><table><thead><tr><th>区分</th><th>見るポイント</th><th>配点</th></tr></thead><tbody>

}
function progressPanel(l, st, u) {

      ${self && st.status !== "ok" ? `<div class="btns"><button class="btn ghost" id="practice">${esc(l.practiceLabel || "ウィッグで練習した")} ＋1</button>

    ${self && !["ok", "wait"].includes(st.status) ? `<button class="btn" id="request">先輩にロープレをお願いする</button>` : ""}

    <button class="btn" id="request">${l.type === "shampoo" ? "採点をお願いする" : "先輩にチェックをお願いする"}</button></section>` : "";
}
function quizPanel(l, st) {

/* 先輩のチェック欄（暗証番号で本人確認） */
function checkPanel(l, st, leadView) {
  if (mode === "cloud" && !(isLead(me()) && route.uid && route.uid !== myUid)) return isLead(me())
    ? `<section class="section"><h3>先輩のチェック</h3><p class="note">アシスタントのチェックは「スタッフ」タブ → 名前 → このレッスン から記録します。</p></section>`
    : `<section class="section"><h3>先輩のチェック</h3><p class="note">チェックは、幹部・オーナーが自分のスマホで記録します。練習が終わったら「先輩にチェックをお願いする」を押して、声をかけよう。</p></section>`;
  const leads = Object.entries(db.users).filter(([, x]) => isLead(x));
  if (!route.open) return `<section class="section"><h3>先輩のチェック</h3>
    <p class="note">チェックは幹部・オーナーが記入します。</p>
    <button class="btn ${leadView ? "" : "ghost"}" id="openCheck">${l.type === "shampoo" ? "採点を記入する" : "チェックを記入する"}</button></section>`;
  let body = "";
  if (l.type === "tech") {
    const remain = l.stages.filter(s => !st.stages.includes(s));
    body = `<div class="field"><label for="ckStage">どこでチェック？</label><select id="ckStage">${remain.map(s => `<option>${esc(s)}</option>`).join("")}</select></div>
      ${oxList(l.checks)}`;
  } else if (l.type === "theory") {
    body = oxList(l.questions);
  } else if (l.type === "roleplay") {
    body = `<div class="field"><label for="ckRound">何回目？</label><select id="ckRound">${l.rounds.map((r, i) => `<option value="${i + 1}" ${st.stages.includes(String(i + 1)) ? "" : ""}>${i + 1}回目：${esc(r)}</option>`).join("")}</select></div>
      ${oxList(l.checks)}`;
  } else if (l.type === "shampoo") {
    const nextRound = Math.min((st.records.at(-1)?.round || 0) + 1, l.rounds.length);
    body = `<div class="field"><label for="ckRound">何回目？</label><select id="ckRound">${l.rounds.map((r, i) => `<option value="${i + 1}" ${nextRound === i + 1 ? "selected" : ""}>${esc(r.day || `${i + 1}回目`)}（${esc(r.m)}）${i + 1 >= l.judgeFrom ? "・合格判定" : ""}</option>`).join("")}</select></div>
      ${(l.judgeExtra || []).length ? `<p class="note">合格判定の日は、こちらも確認してください。</p>${oxList(l.judgeExtra, false)}` : ""}
      ${l.maxJudge ? `<p class="note">合格判定のテストは1日${l.maxJudge}回まで（今日${judgeCount(st, l)}回）。</p>` : ""}
      <div class="marks">${l.score.map(([g, p, pt, req], i) => `<div class="mark"><span>${req ? '<span class="star">★</span> ' : ""}${esc(p)}</span><select data-score="${i}" aria-label="${esc(p)}">${Array.from({ length: pt + 1 }, (_, v) => pt - v).map(v => `<option value="${v}">${v}/${pt}</option>`).join("")}</select></div>`).join("")}</div>
      <div class="total"><span>合計</span><b id="scoreTotal">100</b></div>`;
  }
  return `<form class="section" id="checkForm"><h3>${l.type === "shampoo" ? "採点" : "チェック"}を記入</h3>
    ${body}
    <div class="field"><label for="ckComment">コメント</label><textarea id="ckComment" rows="2" placeholder="よかったところ・次に直すところ"></textarea></div>
    ${mode === "cloud" ? `<button class="btn" type="submit">${esc(me().name)}として記録する</button>` : leads.length ? `<div class="field"><label for="ckBy">チェックした先輩</label><select id="ckBy">${leads.map(([id, x]) => `<option value="${id}" ${id === db.current ? "selected" : ""}>${esc(x.name)}（${ROLE[x.role]}）</option>`).join("")}</select></div>
    <div class="field"><label for="ckPin">暗証番号</label><input id="ckPin" type="password" inputmode="numeric" maxlength="4" placeholder="4桁"></div>
    <button class="btn" type="submit">記録する</button>`
    : `<p class="pending">幹部・オーナーがまだ登録されていません。</p>`}
  </form>`;
}
const judgeCount = (st, l) => st.records.filter(r => r.round >= l.judgeFrom && r.date === today()).length;   // 今日の合格判定の回数
function oxList(items, required = true) {
  return `<div class="marks">${items.map((t, i) => `<div class="mark"><span>${esc(t)}</span><div class="ox">
    <label><input type="radio" name="ox${i}" value="1" ${required ? "required" : ""}>○</label><label><input type="radio" name="ox${i}" value="0">×</label></div></div>`).join("")}</div>`;
}
function recordsPanel(l, st) {
  if (!st.records.length) return "";
  const items = l.type === "shampoo" ? null : l.type === "tech" || l.type === "roleplay" ? l.checks : l.questions;
  return `<section class="section"><h3>チェックの記録</h3><div style="display:grid;gap:10px">
    ${st.records.slice().reverse().map(r => {
      const ng = items ? r.marks.map((v, i) => v ? null : items[i]).filter(Boolean) : l.score.map(([, p, pt], i) => r.marks[i] < pt ? `${p}（${r.marks[i]}/${pt}）` : null).filter(Boolean);
      return `<div class="rec"><div class="h"><span class="chip ${r.pass ? "ok" : "ng"}">${r.pass ? "合格" : "もう一度"}</span>
        <b>${esc(r.label)}</b>${r.score != null ? `<b>${r.score}点</b>` : ""}<span>${esc(r.date)}・${esc(r.by)}</span></div>
        ${ng.length ? `<div class="x">× ${ng.map(esc).join("／")}</div>` : ""}
        ${r.comment ? `<div>${esc(r.comment)}</div>` : ""}</div>`; }).join("")}
  </div></section>`;
}
function nextButton(l, u) {
  if (route.uid || !passed(u, l.id)) return "";
  const c = CATS.find(x => x.id === route.cat) || CATS.find(x => x.lessons.includes(l.id));
  const nextId = c.lessons[c.lessons.indexOf(l.id) + 1];
  return nextId ? `<button class="btn wide" data-lesson="${nextId}">次のレッスン「${esc(L(nextId).title)}」へ</button>`
    : `<button class="btn wide ghost" data-tab="${c.page}">「${esc(c.title)}」はすべて合格。一覧へ</button>`;
}
function bindLesson() {
  const u = subject(), l = L(route.id), st = prog(u, l.id);
  const flash = (msg, err) => { route.msg = msg; route.err = !!err; route.open = false; store.save(); render(); scrollTo(0, 0); };
  const pass = by => Object.assign(st, { status: "ok", passedAt: today(), passedBy: by });
  $$("[data-series]").forEach(b => b.onclick = () => { route.series = b.dataset.series; const y = scrollY; render(); scrollTo(0, y); });
  $("#ajq")?.addEventListener("input", e => { route.q = e.target.value; const y = scrollY, pos = e.target.selectionStart; render(); scrollTo(0, y); const el = $("#ajq"); el.focus(); el.setSelectionRange(pos, pos); });
  $$("details[data-day]").forEach(d => d.ontoggle = () => { if (d.open) route.openDay = Number(d.dataset.day); else if (route.openDay === Number(d.dataset.day)) route.openDay = null; });
  $$("[data-fillform]").forEach(f => f.onsubmit = e => {
    e.preventDefault();
    const ri = Number(f.dataset.fillform), qs = l.rounds[ri].fill;
    const answers = qs.map((_, qi) => f.querySelector(`[data-fill="${qi}"]`).value.trim());
    const graded = qs.map((q, qi) => q.a.length ? q.a.some(a => norm(a) === norm(answers[qi])) : null).filter(x => x !== null);
    st.fill = { ...(st.fill || {}), [ri]: { answers, score: graded.filter(Boolean).length, total: graded.length, date: today() } };
    if (st.status === "todo") st.status = "prac";
    route.openDay = ri; store.save(); const y = scrollY; render(); scrollTo(0, y);
  });
  $$("[data-time]").forEach(b => b.onchange = () => {
    const [ri, ti] = b.dataset.time.split("-").map(Number);
    ((st.times ||= {})[ri] ||= [])[ti] = b.value === "" ? "" : Number(b.value);
    if (st.status === "todo") st.status = "prac";
    route.openDay = ri; store.save(); const y = scrollY; render(); scrollTo(0, y);
  });
  $$("[data-memo]").forEach(b => b.onchange = () => { (st.memo ||= {})[b.dataset.memo] = b.value.trim(); store.save(); });
  $$("[data-self]").forEach(b => b.onchange = () => {
    const [ri, si] = b.dataset.self.split("-").map(Number), cur = (st.self ||= {})[ri] || [];
    st.self[ri] = b.checked ? [...new Set([...cur, si])] : cur.filter(x => x !== si); store.save();
  });
  $$("[data-ck]").forEach(b => b.onchange = () => {
    if (!st.daily || st.daily.date !== today()) st.daily = { date: today(), done: [] };
    const i = Number(b.dataset.ck);
    st.daily.done = b.checked ? [...new Set([...st.daily.done, i])] : st.daily.done.filter(x => x !== i);
    store.save(); const y = scrollY; render(); scrollTo(0, y);
  });
  $("#preQuizForm")?.addEventListener("submit", e => {
    e.preventDefault();
    const n = l.preQuiz.filter((q, i) => Number($(`input[name=pq${i}]:checked`)?.value) === q.answer).length;
    if (n === l.preQuiz.length) { st.preQuiz = today(); route.pq = null; flash("全問正解！予習完了です"); }
    else { route.pq = n; route.msg = null; store.save(); render(); $("#preQuizForm")?.scrollIntoView({ block: "start" }); }
  });
  $("#watched")?.addEventListener("click", () => { st.watched = today(); flash("動画を見たを記録しました"); });
  $("#learned")?.addEventListener("click", () => { pass(""); flash("覚えた！次へ進めます"); });
  $("#practice")?.addEventListener("click", () => { st.practice++; if (st.status === "todo") st.status = "prac"; flash(`練習を記録しました（${st.practice}回目）`); });
  $("#request")?.addEventListener("click", () => { st.status = "wait"; st.requestedAt = Date.now(); flash("チェック待ちにしました。先輩に声をかけよう"); });
  $("#openCheck")?.addEventListener("click", () => { route.open = true; render(); $("#checkForm")?.scrollIntoView({ block: "start" }); });
  $("#quizForm")?.addEventListener("submit", e => {
    e.preventDefault();
    const correct = l.quiz.filter((q, i) => Number($(`input[name=q${i}]:checked`)?.value) === q.answer).length, ok = correct === l.quiz.length;
    if (ok) pass("アプリのテスト"); else if (st.status !== "ok") st.status = "prac";
    route.result = { ok, correct }; store.save(); render();
  });
  const sumScore = () => $$("[data-score]").reduce((a, s) => a + Number(s.value), 0);
  $$("[data-score]").forEach(s => s.onchange = () => $("#scoreTotal").textContent = sumScore());
  $("#checkForm")?.addEventListener("submit", e => {
    e.preventDefault();
    const lead = mode === "cloud" ? me() : db.users[$("#ckBy").value];
    if (mode !== "cloud" && (!lead || lead.pin !== $("#ckPin").value.trim())) { route.open = true; route.msg = "暗証番号がちがいます"; route.err = true; render(); return; }
    const rec = { date: today(), at: Date.now(), by: lead.name, comment: $("#ckComment").value.trim() };
    const keep = () => { st.records.push(rec); persistCheck(rec, route.uid, l.id); };
    if (l.type === "shampoo") {
      rec.marks = $$("[data-score]").map(s => Number(s.value)); rec.score = sumScore(); rec.round = Number($("#ckRound").value);
      const judging = rec.round >= l.judgeFrom;
      if (judging && l.maxJudge && judgeCount(st, l) >= l.maxJudge) { route.open = true; route.msg = `今日のテストは${l.maxJudge}回までです。${l.retryNote || "別の日に再テストしましょう"}`; route.err = true; render(); return; }
      rec.extra = (l.judgeExtra || []).map((_, i) => $(`input[name=ox${i}]:checked`)?.value === "1");
      const extraOk = !judging || rec.extra.every(Boolean);
      const reqOk = l.score.every(([, , pt, req], i) => !req || rec.marks[i] === pt);
      rec.label = rec.round > l.rounds.length ? "追加の判定" : (l.rounds[rec.round - 1].day || `${rec.round}回目`);
      rec.pass = judging && rec.score >= l.passScore && reqOk && extraOk;
      if (rec.pass) pass(lead.name); else st.status = "prac";
      keep();
      const left = l.maxJudge ? l.maxJudge - judgeCount(st, l) : null;
      return flash(rec.pass ? `${rec.score}点、合格です！` : `${rec.score}点。${!judging ? "練習の採点として記録しました。" : !reqOk ? "★必須がまだ満点ではありません。" : !extraOk ? "トリートメントのおすすめまでできたら合格です。" : `合格は${l.passScore}点以上です。`}${judging && left != null ? (left > 0 ? `（今日のテストはあと${left}回）` : `（今日のテストは終わり。${l.retryNote || "別の日に再テスト"}）`) : ""}`, !rec.pass);
    }
    rec.marks = $$(".marks .mark").map((_, i) => $(`input[name=ox${i}]:checked`)?.value === "1");
    const allOk = rec.marks.every(Boolean);
    if (l.type === "tech") {
      rec.stage = $("#ckStage").value; rec.label = rec.stage + "チェック"; rec.pass = allOk;
      if (allOk) st.stages.push($("#ckStage").value);
      const done = l.stages.every(s => st.stages.includes(s));
      if (done) pass(lead.name); else st.status = "prac";
      keep();
      return flash(done ? "すべて○、合格！営業でお客様に入れます" : allOk ? `${$("#ckStage").value}は合格。次は${l.stages.find(s => !st.stages.includes(s))}でチェックを受けよう` : "×のところを練習して、もう一度チェックを受けよう", !allOk);
    }
    if (l.type === "roleplay") {
      const r = $("#ckRound").value; rec.round = Number(r); rec.label = `${r}回目：${l.rounds[r - 1]}`; rec.pass = allOk;
      if (allOk && !st.stages.includes(r)) st.stages.push(r);
      const done = l.rounds.every((_, i) => st.stages.includes(String(i + 1)));
      if (done) pass(lead.name); else st.status = "prac";
      keep();
      return flash(done ? "3回すべて合格！" : allOk ? `${r}回目は合格。次のロープレへ` : "×のところを見直して、もう一度", !allOk);
    }
    rec.label = "口頭チェック"; rec.pass = allOk;
    if (allOk) pass(lead.name); else st.status = "prac";
    keep();
    flash(allOk ? "すべて答えられました。合格！" : "×の質問を復習して、もう一度", !allOk);
  });
}

    <div class="list">${Object.entries(db.users).filter(([uid]) => uid !== myUid).map(([uid, u]) => `<div class="row"><span class="t">${esc(u.name)}<small>${esc(u.store || "")}</small></span>
      <select data-role-uid="${uid}" aria-label="${esc(u.name)}さんの役割" style="border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px">
        ${[["assistant", "アシスタント"], ["lead", "幹部（監督）"]].map(([k, v]) => `<option value="${k}" ${u.role === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>`).join("") || `<p class="pending">まだ誰も登録していません。</p>`}</div>
  </section>` : ""}`;
}
function bindTeam() {
  $$("[data-role-uid]").forEach(s => s.onchange = () => {
    const ref = cloud.doc("roles/" + s.dataset.roleUid);
    (s.value === "assistant" ? ref.delete() : ref.set({ role: s.value })).catch(() => { cloudNote = "役割を保存できませんでした。もう一度やってみてください。"; render(); });
  });
}
function viewMember() {
  const u = db.users[route.uid];
  return `
  <section class="ptitle"><div class="eyebrow">${esc(u.store || "")}・${ROLE[u.role]}</div><h1>${esc(u.name)}さん</h1>
    <div class="meter"><i style="width:${percent(u)}%"></i></div><p class="note">${percent(u)}% 合格・登録 ${esc(u.joined || "")}</p></section>
  ${C.groups.map(g => `<section class="group"><h2>${esc(g.name)}</h2><div class="tablewrap"><table><tbody>
    ${g.categories.map(c => ({ ...c, lessons: c.lessons.filter(id => !C.lessons[id].draft) })).filter(c => c.lessons.length).flatMap(c => c.lessons.map((id, i) => `<tr data-lesson="${id}" data-uid="${route.uid}" style="cursor:pointer"><td style="white-space:nowrap">${i === 0 ? esc(c.title) : ""}</td><td>${esc(L(id).title)}</td><td style="text-align:right">${chip(u, id)}</td></tr>`)).join("")}
  </tbody></table></div></section>`).join("")}`;
}

/* ---------- オーナーAIチャット ---------- */
// claude.ai で開くとAIが答える（content.js の chatSources に並べたマニュアルだけを根拠にする）。
// それ以外の場所ではキーワードの答え → マニュアルの近い章を表示。
let sample = null;
const chatLog = [{ who: "ai", text: "困ったときは何でも聞いてね。オーナーのマニュアルをもとに答えます。" }];
const SOURCES = () => (C.chatSources || []).map(id => `===== ${L(id).title} =====\n${L(id).intro || ""}\n${L(id).body}`).join("\n\n");
const RULES = () => `あなたは美容室「enu」のオーナー・夏実さんの考え方で、スタッフの相談に答えるAIです。
ルール：
- 下のマニュアルに書いてあることだけを根拠に答える。マニュアルにない事実・価格・薬剤の配合などは作らない。
- 答えがマニュアルにない、または判断が難しいときは「マニュアルにまだ載っていないので、オーナーか幹部に確認してください」と書く。近い項目があれば「参考：」で紹介する。
- 夏実さんの言い回しで答える：否定しない、うそやごまかしをしない、理由まで説明する、2択で選んでもらう、ポジティブに言い換える。
- スマホで読みやすく短く。まず結論を1〜2文。次にお客様にそのまま言えるトーク例を「」で。最後に「参考：（マニュアルの章名）」。
- 見出し記号(#)や表は使わない。箇条書きは「- 」、強調は**だけ。日本語で答える。

${SOURCES()}`;

function chatSections() {
  return (C.chatSources || []).flatMap(id => L(id).body.split(/\n(?=#{2,4} )/).map(s => ({ title: `${L(id).title}：${s.split("\n")[0].replace(/^#+\s*/, "")}`, body: s.split("\n").slice(1).join("\n").trim() }))).filter(s => s.body);
}
function searchManual(text) {
  const grams = new Set();
  text.replace(/[？?、。！!「」]/g, " ").split(/\s+/).filter(w => w.length >= 2).forEach(w => { for (let i = 0; i < w.length - 1; i++) grams.add(w.slice(i, i + 2)); });
  return chatSections().map(s => { let n = 0; grams.forEach(g => { if ((s.title + s.title + s.body).includes(g)) n++; }); return { s, n }; })
    .filter(x => x.n > 1).sort((a, b) => b.n - a.n).filter((x, i, all) => i === 0 || (i < 2 && x.n >= all[0].n * 0.8)).map(x => x.s);
}
function viewChat() {
  return `
  <section class="ptitle"><div class="eyebrow">ASK THE OWNER</div><h1>オーナーAIチャット</h1>
  <p class="note" id="chatMode">${sample ? "AIが、カウンセリング＆接客マニュアルと再来術マニュアルをもとに答えます。" : "マニュアルの中から、近い答えを探して表示します。"}</p></section>
  <section class="chat" id="chatLogEl">${chatLog.map(m => m.who === "me" ? `<div class="msg me">${esc(m.text)}</div>` : `<div class="msg ai">${m.html || esc(m.text)}</div>`).join("")}</section>
  <div class="sugg">${["次回予約を「また連絡します」と言われた", "ブリーチしないと出ない色の写真を見せられた", "仕上がりに微妙な顔をされた", "値段が高いと言われた", "仕事が終わったら？"].map(s => `<button data-sugg="${esc(s)}">${esc(s)}</button>`).join("")}</div>
  <form class="chatform" id="chatForm"><input id="chatInput" placeholder="質問を入力" autocomplete="off"><button class="btn" type="submit" id="chatSend">送信</button></form>`;
}
function chatHtml(t) {
  return t.split(/\n+/).map(l => l.trim()).filter(Boolean).map(l => `<p style="margin:0 0 .5em">${inline(l.replace(/^#+\s*/, ""))}</p>`).join("");
}
let chatBusy = false;
function bindChat() {
  const logEl = $("#chatLogEl");
  const add = m => { chatLog.push(m); const d = document.createElement("div"); d.className = "msg " + m.who; if (m.who === "me") d.textContent = m.text; else d.innerHTML = m.html || esc(m.text); logEl.appendChild(d); d.scrollIntoView({ block: "end" }); return d; };
  const offline = text => {
    const hit = C.ownerQA.find(q => q.keys.some(k => text.includes(k)));
    if (hit) return add({ who: "ai", text: hit.a });
    const secs = searchManual(text);
    add(secs.length ? { who: "ai", html: secs.map(s => `<b>${esc(s.title)}</b>` + md(s.body.slice(0, 700) + (s.body.length > 700 ? "\n…（続きはマニュアルで）" : ""))).join("<hr style='border:0;border-top:1px solid var(--line)'>") }
      : { who: "ai", text: "その質問の答えはまだマニュアルにありません。オーナーか幹部に直接聞いてみてね。" });
  };
  const ask = async text => {
    text = text.trim(); if (!text || chatBusy) return;
    $("#chatInput").value = "";
    add({ who: "me", text });
    if (!sample) return offline(text);
    chatBusy = true; $("#chatSend").disabled = true;
    const out = add({ who: "ai", text: "考えています…" }), entry = chatLog[chatLog.length - 1];
    const history = chatLog.slice(1, -2).filter(m => m.raw || m.who === "me").slice(-6).map(m => ({ role: m.who === "me" ? "user" : "assistant", content: m.raw || m.text }));
    const msgs = [...history, { role: "user", content: text }];
    msgs[0] = { role: "user", content: RULES() + "\n\nスタッフの質問：\n" + msgs[0].content };
    try {
      const r = await sample(msgs, { cache: false, modelTier: "default", onText: ({ text: t }) => { out.innerHTML = chatHtml(t); } });
      entry.raw = r.text; entry.html = chatHtml(r.text); out.innerHTML = entry.html;
    } catch (e) {
      entry.html = esc(e?.code === "rate_limited" ? "いま質問が集中しています。少し待ってから送ってください。" : "AIが使えなかったので、マニュアルから近い答えを探します。");
      out.innerHTML = entry.html;
      if (e?.code === "not_granted") sample = null;
      if (e?.code !== "rate_limited") offline(text);
    } finally { chatBusy = false; $("#chatSend").disabled = false; }
  };
  $("#chatForm").onsubmit = e => { e.preventDefault(); ask($("#chatInput").value); };
  $$("[data-sugg]").forEach(b => b.onclick = () => ask(b.dataset.sugg));
}
(async () => {
  try { sample = window.claude?.use ? await window.claude.use("sample") : null; } catch { sample = null; }
  if (route.name === "chat" && $("#chatMode")) $("#chatMode").textContent = sample ? "AIが、カウンセリング＆接客マニュアルと再来術マニュアルをもとに答えます。" : "マニュアルの中から、近い答えを探して表示します。";
})();

/* ---------- 描画 ---------- */
const VIEWS = {
  home: [viewHome], pre: [viewPre], cats: [viewCats], cat: [viewCat], lesson: [viewLesson, bindLesson],
  roadmap: [viewRoadmap], team: [viewTeam, bindTeam], member: [viewMember], chat: [viewChat, bindChat], mypage: [viewMypage, bindMypage],
};
const TITLES = { mypage: "マイページ", pre: "入社前プログラム", roadmap: "ロードマップ", team: "みんなの進み具合", member: "進み具合", chat: "オーナーAIチャット" };

function render() {
  if (mode === "loading" || (mode === "cloud" && !cloudState.loaded)) {
    $("#tabs").hidden = true; $("#backBtn").hidden = true; $("#brand").className = "brand logo"; $("#brand").textContent = "enu ACADEMY";
    $("#view").innerHTML = `<p class="pending" style="padding:40px 0;text-align:center">読み込んでいます…</p>`; return;
  }
  const u = me();
  if (!u) {
    $("#tabs").hidden = true; $("#brand").className = "brand logo";
    $("#backBtn").hidden = true; $("#who").innerHTML = ""; $("#brand").textContent = "enu ACADEMY";
    $("#view").innerHTML = (cloudNote ? `<div class="toast err">${esc(cloudNote)}</div>` : "") + viewLogin(); bindLogin(); return;
  }
  const [view, bind] = VIEWS[route.name] || VIEWS.home;
  $("#backBtn").hidden = !stack.length;
  $("#tabs").hidden = false;
  $("#tabsIn").innerHTML = TABS().map(([k, l]) => `<button data-tab="${k}" ${k === activeTab ? 'aria-current="page"' : ""}>${l}</button>`).join("");
  $("#brand").className = route.name === "home" ? "brand logo" : !stack.length ? "brand logo small" : "brand";
  $("#brand").textContent = !stack.length ? "enu ACADEMY" : route.name === "cats" ? C.pages[route.page].title : route.name === "cat" ? CATS.find(c => c.id === route.id).title : route.name === "lesson" ? L(route.id).title : TITLES[route.name] || "enu ACADEMY";
  $("#who").innerHTML = "";
  $("#view").innerHTML = (cloudNote ? `<div class="toast err">${esc(cloudNote)}</div>` : "") + view();
  $$("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  $$("[data-tab]").forEach(b => b.onclick = () => tab(b.dataset.tab));
  $$("[data-scroll]").forEach(b => b.onclick = () => $("#" + b.dataset.scroll)?.scrollIntoView({ behavior: "smooth" }));
  $$("[data-page]").forEach(b => b.onclick = () => go("cats", { page: b.dataset.page }));
  $$("[data-cat]").forEach(b => b.onclick = () => go("cat", { id: b.dataset.cat, uid: route.uid }));
  $$("[data-lesson]").forEach(b => b.onclick = () => go("lesson", { id: b.dataset.lesson, cat: route.name === "cat" ? route.id : route.cat, uid: b.dataset.uid || route.uid }));
  $$("[data-member]").forEach(b => b.onclick = () => go("member", { uid: b.dataset.member }));
  $$("[data-store]").forEach(b => b.onclick = () => { route.store = b.dataset.store; render(); });
  bind && bind();
}
boot();
</script>
