<text x="110" y="62" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" font-size="14.5" font-weight="800" fill="#8b5a2b" text-anchor="middle">① ふだんの髪</text>
<text x="110" y="348" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" font-size="12.5" font-weight="400" fill="#7b736b" text-anchor="middle">2本の鎖が</text>
<text x="110" y="366" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" font-size="12.5" font-weight="400" fill="#7b736b" text-anchor="middle">「S-S」でつながっている</text>
<text x="330" y="62" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" font-size="14.5" font-weight="800" fill="#8b5a2b" text-anchor="middle">② 1剤で切る（還元）</text>
<text x="330" y="348" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" font-size="12.5" font-weight="400" fill="#7b736b" text-anchor="middle">S-Sが切れて</text>
<text x="330" y="366" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" font-size="12.5" font-weight="400" fill="#7b736b" text-anchor="middle">形を変えられる状態に</text>
<text x="550" y="62" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" font-size="14.5" font-weight="800" fill="#8b5a2b" text-anchor="middle">③ 巻いて2剤でつなぐ（酸化）</text>
<text x="550" y="348" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" font-size="12.5" font-weight="400" fill="#7b736b" text-anchor="middle">ロッドの形のまま</text>
<text x="550" y="366" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" font-size="12.5" font-weight="400" fill="#7b736b" text-anchor="middle">新しい場所でつながる</text>
